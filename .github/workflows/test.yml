name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    # ubuntu-latest (26.04) has no Python 3.9 build, so the 3.9 cell runs on 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      # One cell's setup failure must not cancel the others' test results.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (stdlib only)
        run: python3 -m unittest discover tests -v
      - name: Smoke-test the CLI
        run: |
          python3 ssot_check.py --version
          python3 ssot_check.py validate -f .ssot.example.yaml

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check this repository's SSOT manifest and discovery coverage
        uses: ./
        with:
          manifest: .ssot.yaml
          discover: warn
