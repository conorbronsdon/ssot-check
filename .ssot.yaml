# ssot-check dogfoods its own release metadata. Historical versions in the
# changelog and examples are excluded from discovery, but the current release
# heading remains an explicit checked copy below.
ignore_paths:
  - "CHANGELOG.md"
  - "tests/fixtures/**"

facts:
  - name: release-version
    type: semver
    note: >
      Current CLI, Codex plugin, documented Action tag, and changelog release.
    canonical:
      file: ssot_check.py
      pattern: '__version__\s*=\s*"([^"]+)"'
    copies:
      - file: .codex-plugin/plugin.json
        pattern: '"version"\s*:\s*"([^"]+)"'
      - file: README.md
        pattern: 'uses:\s*conorbronsdon/ssot-check@(v[0-9]+\.[0-9]+\.[0-9]+)'
      - file: CHANGELOG.md
        pattern: '## \[([0-9]+\.[0-9]+\.[0-9]+)\]'
